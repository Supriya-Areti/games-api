name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and build jar
        run: ./mvnw clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t games-api:ci .

      - name: Tag Docker image as latest
        run: docker tag games-api:ci 004878717876.dkr.ecr.us-east-1.amazonaws.com/games-api:latest

      - name: Tag Docker image with commit SHA
        run: docker tag games-api:ci 004878717876.dkr.ecr.us-east-1.amazonaws.com/games-api:${{ env.SHORT_SHA }}

      - name: Push latest image to ECR
        run: docker push 004878717876.dkr.ecr.us-east-1.amazonaws.com/games-api:latest

      - name: Push commit SHA image to ECR
        run: docker push 004878717876.dkr.ecr.us-east-1.amazonaws.com/games-api:${{ env.SHORT_SHA }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster games-api-cluster \
            --service games-api-task-service-2016y2ts \
            --force-new-deployment